name: design-vault collect html structure

on:
  # 週次自動実行: 毎週土曜 JST 4:00（UTC 19:00金曜）
  # collect-design-rules（日曜）の前日に実行して両方の収集が揃う
  schedule:
    - cron: "0 19 * * 5"

  # 手動実行（業種指定・品質フィルタ可）
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数（デフォルト: 50）"
        required: false
        default: "50"
      min_quality:
        description: "最低品質スコア（1-5、デフォルト: 3）"
        required: false
        default: "3"
      industry:
        description: "業種フィルタ（例: 飲食, 美容・サロン, IT・SaaS, 不動産, 医療。空白で全業種）"
        required: false
        default: ""

concurrency:
  # 業種別に独立したグループにして並列実行可能にする
  # 同一業種の重複実行のみ防止する
  group: collect-html-structure-${{ github.event.inputs.industry || 'all' }}
  cancel-in-progress: false

jobs:
  collect-html-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run collect-html-structure script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '50' }}
          MIN_QUALITY=${{ github.event.inputs.min_quality || '3' }}
          INDUSTRY="${{ github.event.inputs.industry }}"

          CMD="npx tsx scripts/collect-html-structure.ts --limit=$LIMIT --min-quality=$MIN_QUALITY"
          if [ -n "$INDUSTRY" ]; then
            CMD="$CMD --industry=$INDUSTRY"
          fi

          echo "実行コマンド: $CMD"
          eval $CMD
