name: design-vault collect

on:
  # 毎朝 JST 8:00
  schedule:
    - cron: "0 23 * * *" # UTC 23:00 = JST 8:00

  # 手動実行
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数"
        required: false
        default: "50"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run harvest script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          npx tsx scripts/harvest.ts --limit=100
        continue-on-error: true

      - name: Run collect script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '50' }}
          npx tsx scripts/collect.ts --limit=$LIMIT

      - name: Run discover script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          npx tsx scripts/discover.ts --limit=20
