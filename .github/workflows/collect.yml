name: design-vault collect

on:
  # 1日4回: JST 6:00, 12:00, 18:00, 0:00
  schedule:
    - cron: "0 21 * * *"  # UTC 21:00 = JST 6:00
    - cron: "0 3 * * *"   # UTC 3:00  = JST 12:00
    - cron: "0 9 * * *"   # UTC 9:00  = JST 18:00
    - cron: "0 15 * * *"  # UTC 15:00 = JST 0:00

  # 手動実行
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数"
        required: false
        default: "150"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Cleanup duplicates and stale queue
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/dedup.ts
        continue-on-error: true

      - name: Retry blocked sites
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/retry.ts --limit=20
        continue-on-error: true

      - name: Run harvest script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          npx tsx scripts/harvest.ts --limit=200
        continue-on-error: true

      - name: Run collect script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '80' }}
          npx tsx scripts/collect.ts --limit=$LIMIT

      - name: Run discover script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          npx tsx scripts/discover.ts --limit=50

      - name: Backfill section DOM data
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/collect.ts --sections-only --limit=50
        continue-on-error: true

      - name: Collect full-page screenshots (Phase 12b)
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/collect-full-screenshots.ts --limit=20 --min-quality=3
        continue-on-error: true
