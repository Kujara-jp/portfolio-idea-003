name: design-vault score & tag

on:
  # 毎日 JST 18:30
  schedule:
    - cron: "30 9 * * *" # UTC 9:30 = JST 18:30

  # collect 完了後に自動トリガー
  workflow_run:
    workflows: ["design-vault collect"]
    types: [completed]

  # 手動実行
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数"
        required: false
        default: "100"

concurrency:
  group: score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run score script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '80' }}
          npx tsx scripts/score.ts --limit=$LIMIT

      - name: Run tag script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '80' }}
          npx tsx scripts/tag.ts --limit=$LIMIT

      - name: Run industry classification script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '80' }}
          npx tsx scripts/industry.ts --limit=$LIMIT
