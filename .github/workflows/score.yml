name: design-vault score & tag

on:
  # 毎晩 JST 22:00
  schedule:
    - cron: "0 13 * * *" # UTC 13:00 = JST 22:00

  # 手動実行
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数"
        required: false
        default: "100"

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run score script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '50' }}
          npx tsx scripts/score.ts --limit=$LIMIT

      - name: Run tag script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '50' }}
          npx tsx scripts/tag.ts --limit=$LIMIT
