name: design-vault collect full screenshots

on:
  # 週次自動実行: 毎週日曜 JST 5:00（UTC 土曜 20:00）
  # collect-html-structure（土曜）の翌日に実行してパイプラインが順番に流れる
  schedule:
    - cron: "0 20 * * 6"

  # 手動実行（件数・品質フィルタ・強制再収集 可）
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数（デフォルト: 20）"
        required: false
        default: "20"
      min_quality:
        description: "最低品質スコア（1-5、デフォルト: 3）"
        required: false
        default: "3"
      force:
        description: "screenshots_full が既存でも再収集する（true/false）"
        required: false
        default: "false"

concurrency:
  group: collect-full-screenshots
  cancel-in-progress: false

jobs:
  collect-full-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run collect-full-screenshots script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '20' }}
          MIN_QUALITY=${{ github.event.inputs.min_quality || '3' }}
          FORCE=${{ github.event.inputs.force || 'false' }}

          CMD="npx tsx scripts/collect-full-screenshots.ts --limit=$LIMIT --min-quality=$MIN_QUALITY"
          if [ "$FORCE" = "true" ]; then
            CMD="$CMD --force"
          fi

          echo "実行コマンド: $CMD"
          eval $CMD
