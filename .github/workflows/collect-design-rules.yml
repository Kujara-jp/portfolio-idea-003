name: design-vault collect design rules

on:
  # 週次自動実行: 毎週日曜 JST 3:00（UTC 18:00土曜）
  # collect/scoreパイプラインの負荷が低い時間帯に実行
  schedule:
    - cron: "0 18 * * 6"

  # 手動実行
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する最大件数（デフォルト: 50）"
        required: false
        default: "50"

concurrency:
  group: collect-design-rules
  cancel-in-progress: false

jobs:
  collect-design-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run collect-design-rules script
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '50' }}
          npx tsx scripts/collect-design-rules.ts --limit=$LIMIT
