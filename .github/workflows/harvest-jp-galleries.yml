name: harvest JP galleries

on:
  # 週3回: JST 月・水・金 の 3:00（UTC 18:00 前日）
  schedule:
    - cron: "0 18 * * 0"  # UTC日曜 18:00 = JST月曜 3:00
    - cron: "0 18 * * 2"  # UTC火曜 18:00 = JST水曜 3:00
    - cron: "0 18 * * 4"  # UTC木曜 18:00 = JST金曜 3:00

  # 手動実行（ソース指定可能）
  workflow_dispatch:
    inputs:
      source:
        description: "収集ソース (jp-galleries / webdesignclip / io3000 / muuuuu / sankou)"
        required: false
        default: "jp-galleries"
      limit:
        description: "collect_queue に投入する最大件数"
        required: false
        default: "200"

concurrency:
  group: harvest-jp
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Harvest JP galleries
        env:
          SUPABASE_URL: ${{ secrets.DESIGN_VAULT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DESIGN_VAULT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SOURCE=${{ github.event.inputs.source || 'jp-galleries' }}
          LIMIT=${{ github.event.inputs.limit || '200' }}
          npx tsx scripts/harvest.ts --source=$SOURCE --limit=$LIMIT
